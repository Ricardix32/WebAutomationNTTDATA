serenity {
  project.name = "AutoWebSemana03"    //Uso la página de staging donde hice prácticas profesor
  take.screenshots = FOR_EACH_ACTION  //Yuntas Publicidad - Login (staging)
  restart.browser.for.each = scenario
  use.unique.browser = false
}

headless.mode = false

webdriver {
  driver = chrome
  autodownload = true
  timeouts {
    implicitlywait = 5000
    fluentwait = 10000
  }
  capabilities {
    browserName = "chrome"
    acceptInsecureCerts = true
    "goog:chromeOptions" {
      args = [
        "remote-allow-origins=*",
        "start-maximized",
        "ignore-certificate-errors",
        "disable-infobars",
        "disable-gpu",
        "disable-popup-blocking"
      ]
    }
  }
}

environments {
  default {
    webdriver.base.url = "https://staging.yuntaspublicidad.com/login/"
  }
}

credentials {
  admin {
    email = "admin@admin.com"
    password = "password"
  }
}